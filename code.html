<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_439 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_439" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_439');
  const devicePixelRatio = window.devicePixelRatio || 1;
  /**
 * Deluxe Mahal Restaurant - Client Interactivity Script (js/script.js)
 * Implements smooth scrolling, form validation, filterable menu/gallery tabs, and lightbox functionality.
 */

document.addEventListener('DOMContentLoaded', () => {
  // 1. Navigation Active State & Smooth Scrolling
  const navLinks = document.querySelectorAll('.nav-link, .smooth-scroll');
  navLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      const targetId = this.getAttribute('href');
      if (targetId && targetId.startsWith('#') && targetId.length > 1) {
        e.preventDefault();
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  // 2. Menu Category Filtering
  const menuFilters = document.querySelectorAll('[data-menu-filter]');
  const menuItems = document.querySelectorAll('[data-menu-category]');

  if (menuFilters.length && menuItems.length) {
    menuFilters.forEach(button => {
      button.addEventListener('click', () => {
        menuFilters.forEach(btn => btn.classList.remove('active', 'btn-gold'));
        button.classList.add('active', 'btn-gold');

        const selectedCategory = button.getAttribute('data-menu-filter');
        menuItems.forEach(item => {
          if (selectedCategory === 'all' || item.getAttribute('data-menu-category') === selectedCategory) {
            item.style.display = 'block';
            item.classList.add('animate__fadeIn');
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  }

  // 3. Gallery Lightbox Modal Popup
  const galleryItems = document.querySelectorAll('.gallery-card');
  const lightboxModal = document.getElementById('galleryModal');
  const lightboxImg = document.getElementById('lightboxImage');
  const lightboxTitle = document.getElementById('lightboxCaptionTitle');
  const lightboxDesc = document.getElementById('lightboxCaptionDesc');

  if (galleryItems.length && lightboxModal && lightboxImg) {
    galleryItems.forEach(card => {
      card.addEventListener('click', function() {
        const imgSrc = this.querySelector('img')?.getAttribute('src');
        const title = this.getAttribute('data-title') || this.querySelector('h5')?.innerText;
        const desc = this.getAttribute('data-desc') || this.querySelector('p')?.innerText;

        if (imgSrc) lightboxImg.setAttribute('src', imgSrc);
        if (lightboxTitle && title) lightboxTitle.innerText = title;
        if (lightboxDesc && desc) lightboxDesc.innerText = desc;

        // Initialize bootstrap modal
        if (window.bootstrap && bootstrap.Modal) {
          const modalInstance = new bootstrap.Modal(lightboxModal);
          modalInstance.show();
        }
      });
    });
  }

  // 4. Table Reservation Form Client-Side Validation
  const reservationForm = document.getElementById('reservationForm');
  const reservationSuccessAlert = document.getElementById('reservationSuccessAlert');

  if (reservationForm) {
    reservationForm.addEventListener('submit', function(event) {
      event.preventDefault();
      event.stopPropagation();

      if (!reservationForm.checkValidity()) {
        reservationForm.classList.add('was-validated');
      } else {
        reservationForm.classList.remove('was-validated');
        const submitBtn = reservationForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Securing Royal Table...`;

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          reservationForm.reset();

          if (reservationSuccessAlert) {
            reservationSuccessAlert.classList.remove('d-none');
            reservationSuccessAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => {
              reservationSuccessAlert.classList.add('d-none');
            }, 6000);
          } else {
            alert('Your royal table reservation request has been confirmed! We look forward to welcoming you.');
          }
        }, 1200);
      }
    }, false);
  }
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_439 -->
</body>
</html>
